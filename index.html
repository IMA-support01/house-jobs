<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Jobs</title>
<meta name="description" content="The kitchen board: small jobs for points, weekly zones and who is captain.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="House Jobs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="qrcode.min.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#f4f3ef;--card:#ffffff;--fill:#f0efec;--fill-2:#e4e2dc;--line:#e0ded7;
  --ink:#0b0b0b;--ink-2:#52514e;--ink-3:#6b6a65;
  --good:#0a7a0a;--good-bg:#e8f3e6;
  --bad:#b42318;--bad-bg:#fbeae8;
  --btn:#1c1b19;--btn-ink:#ffffff;--btn-2:#ffffff;
  --focus:#1c5cab;--scrim:rgba(18,18,17,.45);
  --p1:#2a78d6;--p1-ink:#ffffff;
  --p2:#eda100;--p2-ink:#0b0b0b;
  --p3:#e87ba4;--p3-ink:#0b0b0b;
  --p4:#008300;--p4-ink:#ffffff;
  --p5:#4a3aa7;--p5-ink:#ffffff;
  --p0:#8f8d86;--p0-ink:#ffffff;
  --shadow:0 1px 2px rgba(24,22,16,.06),0 2px 6px rgba(24,22,16,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#121211;--card:#1a1a19;--fill:#242422;--fill-2:#302f2c;--line:#34332f;
    --ink:#ffffff;--ink-2:#c3c2b7;--ink-3:#a3a298;
    --good:#5ccb5c;--good-bg:#17301a;
    --bad:#f28b82;--bad-bg:#3b1d1a;
    --btn:#f4f3ef;--btn-ink:#121211;--btn-2:#242422;
    --focus:#86b6ef;--scrim:rgba(0,0,0,.6);
    --p1:#3987e5;--p1-ink:#0b0b0b;
    --p2:#c98500;--p2-ink:#0b0b0b;
    --p3:#d55181;--p3-ink:#0b0b0b;
    --p4:#008300;--p4-ink:#ffffff;
    --p5:#7c3aed;--p5-ink:#ffffff;
    --p0:#6f6d67;--p0-ink:#ffffff;
    --shadow:none;
  }
}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app{max-width:1500px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}

/* header */
.top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.grow{flex:1;min-width:0}
.top h1{margin:0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.top .sub{margin:2px 0 0;color:var(--ink-2);font-size:17px}
.clock{font-size:40px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.icon-btn{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.warn{margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:600}

/* layout: jobs across the top, then zones beside points and today (tablet landscape),
   or zones, then points beside today (tablet portrait), or one column (phone) */
.board{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.side{display:grid;gap:16px;align-content:start;align-items:start;min-width:0}
@media (min-width:760px){
  .side{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (min-width:1000px){
  .board{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .jobs{grid-column:1/-1}
  .side{grid-template-columns:minmax(0,1fr)}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;margin-bottom:14px}
.card h2{margin:0;font-size:22px;line-height:1.2;font-weight:700}
.hint{margin:0;color:var(--ink-2);font-size:16px}

/* jobs */
.job-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.job-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.job-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:359px){.job-grid{grid-template-columns:minmax(0,1fr)}}
.job{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:116px;padding:16px;border-radius:14px;border:1.5px solid transparent;background:var(--fill);text-align:left}
.job:active{background:var(--fill-2)}
.job .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job .name{font-size:22px;font-weight:650;line-height:1.2;min-width:0;overflow-wrap:break-word}
.job .status{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--ink-2);min-height:22px;line-height:1.3}
.job .status svg{flex:none}
.job.locked{background:transparent;border-style:dashed;border-color:var(--fill-2)}
.job.locked .name{color:var(--ink-2)}
.pts{display:inline-block;min-width:48px;text-align:center;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
@media (max-width:759px){.job{min-height:104px;padding:14px}.job .name{font-size:19px}.job .head{flex-direction:column;align-items:flex-start;gap:6px}}
.rules{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:16px;line-height:1.5;color:var(--ink-2)}
.rules b{color:var(--ink)}

/* people */
.av{width:48px;height:48px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;line-height:1;flex:none;background:var(--pc);color:var(--pc-ink)}
.av.sm{width:44px;height:44px;font-size:20px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none;display:inline-block}
.who-1{--pc:var(--p1);--pc-ink:var(--p1-ink)}
.who-2{--pc:var(--p2);--pc-ink:var(--p2-ink)}
.who-3{--pc:var(--p3);--pc-ink:var(--p3-ink)}
.who-4{--pc:var(--p4);--pc-ink:var(--p4-ink)}
.who-5{--pc:var(--p5);--pc-ink:var(--p5-ink)}
.who-0{--pc:var(--p0);--pc-ink:var(--p0-ink)}
.av.two{font-size:19px;letter-spacing:-.02em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;border:1.5px solid var(--ink-3);background:var(--btn-2);font-weight:650;font-size:17px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.sm{min-height:48px;padding:0 15px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);min-height:44px;padding:0 10px;text-decoration:underline;text-underline-offset:3px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* zones */
.zone-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.zone{display:grid;width:100%;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"av head act" "av tasks tasks";align-items:center;column-gap:14px;row-gap:8px;padding:14px;border-radius:14px;background:var(--fill);border:0;text-align:left}
.zone:active{background:var(--fill-2)}
.zone.done{background:var(--good-bg)}
.zone > .av{grid-area:av;align-self:start}
.zhead{grid-area:head;min-width:0}
.zact{grid-area:act}
.zname{display:block;font-weight:650;font-size:20px;line-height:1.25}
.zwho{display:block;font-size:17px}
.ztasks{grid-area:tasks}
.zprog{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;padding:10px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--ink-3);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;color:var(--ink-2);line-height:1.4}
.chip.on{color:var(--good);font-weight:600}
.state-done{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:650;white-space:nowrap;font-size:18px}
.state-done small{display:block;color:var(--ink-2);font-weight:400;font-size:15px}
.late{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px 12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bad-bg);margin-bottom:10px}
.late p{margin:0;font-size:17px;display:flex;gap:10px;align-items:flex-start;flex:1 1 220px}
.late svg{flex:none;color:var(--bad);margin-top:2px}
.captain{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.captain .label{font-size:15px;color:var(--ink-2)}
.captain .cname{font-weight:650;font-size:20px}
.captain .nudge{font-size:16px;font-weight:600;margin-top:2px}

/* points */
.ptable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ptable th{font-size:15px;font-weight:600;color:var(--ink-2);text-align:right;padding:0 0 8px 12px;white-space:nowrap}
.ptable th:first-child{text-align:left;padding-left:0}
.ptable td{padding:6px 0 6px 12px;vertical-align:middle;text-align:right;font-size:24px;font-weight:700}
.ptable td.person{text-align:left;padding-left:0;font-weight:600;font-size:19px;white-space:nowrap}
.person-cell{display:flex;align-items:center;gap:12px}
.bar-cell{width:36%}
.track{height:14px;background:var(--fill);border-radius:0 4px 4px 0;overflow:hidden}
.bar{height:100%;background:var(--pc);border-radius:0 4px 4px 0}
.neg{color:var(--bad)}
.note{margin:12px 0 0;font-size:17px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* today + log */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:17px;min-height:50px}
.feed li:first-child{border-top:0}
.feed time{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:16px;width:50px;flex:none}
.feed .what{flex:1;min-width:0}
.feed .what b{font-weight:650}
.feed .what span{color:var(--ink-2)}
.feed .gain{font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center}
.feed .gain.ok{color:var(--good)}
.empty,.more{color:var(--ink-2);margin:0;font-size:17px}
.more{margin-top:6px}
.day-h{margin:18px 0 4px;font-size:16px;color:var(--ink-2);font-weight:650}

/* dialogs */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--card);color:var(--ink);border-radius:20px;max-width:640px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
.dialog.wide{max-width:900px}
.dialog:focus{outline:none}
.dialog h2{margin:0 0 4px;font-size:26px;line-height:1.2}
.dialog .lead{margin:0 0 18px;color:var(--ink-2);font-size:17px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pick{display:flex;align-items:center;gap:16px;min-height:104px;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--fill);font-size:26px;font-weight:650;text-align:left}
.pick:active{background:var(--fill-2)}
.pick .av{width:60px;height:60px;font-size:28px}
.pick .av.two{font-size:24px}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;flex-wrap:wrap}
.sticky-actions{position:sticky;bottom:-24px;background:var(--card);padding:14px 0 24px;margin-bottom:-24px;border-top:1px solid var(--line)}
.q{margin:18px 0 10px;font-weight:650;font-size:18px}
.q .opt{font-weight:400;color:var(--ink-2)}
.pill-row{display:flex;flex-wrap:wrap;gap:10px}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--fill);font-weight:650;font-size:18px}
.pill[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.pill:disabled{opacity:.35;cursor:default}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper .btn{width:60px;height:60px;padding:0}
.stepper .num{font-size:40px;font-weight:700;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stepper .eq{font-size:18px;color:var(--ink-2)}

/* zone checklist */
.check-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.citem{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--fill);font-size:20px;font-weight:600;text-align:left}
.citem .box{width:32px;height:32px;border-radius:8px;border:2px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--card)}
.citem.on{background:var(--good-bg);border-color:transparent}
.citem.on .box{background:var(--good);border-color:var(--good);color:var(--card)}
.citem small{margin-left:auto;font-size:15px;color:var(--ink-2);font-weight:400;white-space:nowrap}
.citem:disabled{cursor:default}
.zline{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pbar{flex:1;height:12px;background:var(--fill);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}

/* week sum-up */
.sum-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 16px}
.sum-head .lead{margin-bottom:0}
.sum-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stat{background:var(--fill);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.stat .k{font-size:15px;color:var(--ink-2)}
.stat .v{font-size:21px;font-weight:700;line-height:1.25}
.sum-sec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.sum-sec h3{margin:0 0 12px;font-size:19px}
.sum-zones{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sum-zones li{display:flex;align-items:center;gap:12px;font-size:17px;flex-wrap:wrap}
.sum-zones .muted{color:var(--ink-2)}
.sum-zones .missed{flex-basis:100%;margin:-4px 0 0 56px;font-size:15px;color:var(--ink-2)}
.zstate{margin-left:auto;font-weight:650;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.zstate.ok{color:var(--good)}
.zstate.bad{color:var(--bad)}
.zstate.wait{color:var(--ink-2)}
.sum-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sum-table th{font-size:15px;font-weight:600;color:var(--ink-2);text-align:right;padding:0 0 8px 12px;white-space:nowrap}
.sum-table th:first-child{text-align:left;padding-left:0}
.sum-table td{padding:8px 0 8px 12px;text-align:right;font-size:19px;border-top:1px solid var(--line)}
.sum-table td:first-child{text-align:left;padding-left:0;font-weight:600}
.sum-table td.total{font-weight:700;font-size:22px}
.did{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.did li{font-size:17px;line-height:1.45}
.did li span{color:var(--ink-2)}
.sum-month{margin:0;font-size:18px}
.wa-row{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center}
.qr{background:#ffffff;padding:14px;border-radius:14px;width:340px;height:340px;flex:none;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:100%}
.wa-text{flex:1 1 260px}
.wa-text p{margin:0 0 14px;font-size:17px}

/* settings */
.form-sec{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}
.form-sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.form-sec h3{margin:0 0 4px;font-size:19px}
.form-sec .help{margin:0 0 12px;color:var(--ink-2);font-size:16px}
.field{display:grid;gap:4px;margin-bottom:10px;min-width:0}
.field.mt{margin-top:14px}
.field .lbl{font-size:15px;color:var(--ink-2);font-weight:600}
input[type=text],input[type=password],select,textarea{min-height:50px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);width:100%}
textarea{line-height:1.45;resize:vertical}
textarea.copy{min-height:280px;font-size:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row{display:grid;gap:0 10px;align-items:end}
.job-row{grid-template-columns:minmax(0,1fr) 96px 130px auto}
.job-row .btn.quiet{margin-bottom:12px}
.job-row + .job-row .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.zone-row{grid-template-columns:minmax(0,220px) minmax(0,1fr);align-items:start}
.person-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:end}
.person-row .btn.quiet{margin-bottom:12px}
.person-row + .person-row .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.person-row.leaving input{text-decoration:line-through;opacity:.55}
.check{display:flex;align-items:center;gap:12px;min-height:50px;font-weight:600}
.check input{width:24px;height:24px}
.error{color:var(--bad);font-weight:600;margin:10px 0 0}
@media (max-width:620px){
  .job-row{grid-template-columns:1fr 1fr}
  .job-row .field:first-child{grid-column:1/-1}
  .zone-row,.grid-2,.sum-top{grid-template-columns:1fr}
  .pick{font-size:22px;min-height:84px}
  .pick .av{width:52px;height:52px;font-size:24px}
  .clock{font-size:30px}
  .qr{width:240px;height:240px}
  .sum-zones .missed{margin-left:0}
}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--btn);color:var(--btn-ink);border-radius:14px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:14px;font-size:18px;width:max-content;max-width:calc(100% - 32px);transition:opacity .18s,transform .18s;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:10px;min-height:44px;padding:0 14px;font-weight:650;flex:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">This board needs JavaScript switched on.</p></noscript>
<script>
(function () {
  'use strict';

  var KEY = 'houseJobs.v1';
  var UNDO_MS = 2 * 60 * 1000;     // how long a tap can be taken back from the board
  var GRACE_HOUR = 10;             // last week's zones can still be ticked until Monday 10:00
  var PIN_OPEN_MS = 5 * 60 * 1000; // PIN stays open this long after it is typed
  var KEEP_DAYS = 400;
  var DISH = 'dishes';
  var DISH_NAME = 'Wash others’ dishes';

  /* ---------- dates, all in the tablet's local time ---------- */

  function freshState(now) {

        { id: 'p3', name: 'Brodie' },

  function findPerson(id) { for (var i = 0; i < S.people.length; i++) if (S.people[i].id === id) return S.people[i]; return null; }

  function perBadge() { return S.dishesPer === 1 ? '+1 each' : '+1 per ' + S.dishesPer; }

  /* ---------- weeks, zones and the rota ---------- */

  function week(wk) { return S.weeks[wk] || computeWeek(wk); }

    S.entries.forEach(function (e) {
      var at = new Date(e.at);

        else r.by[e.jobName] = (r.by[e.jobName] || 0) + 1;

  // The text that goes to the WhatsApp group. The short one keeps the QR code easy to scan.

    L.push('Captain: ' + person(d.captain).name, '', 'Zones');
    d.zones.forEach(function (x) {

  /* ---------- the week sum-up ---------- */
  var sumWeek = null;
  function defaultSumWeek(now) {

  }
  function openSumup(wk) {
    var now = new Date(), cur = weekKey(now), first = firstWeek();
    if (wk < first) wk = first;

    sumWeek = wk;
    var d = weekData(wk, now);
    var totals = d.list.map(function (r) { return r.total; });
    var minT = Math.min.apply(null, totals), maxT = Math.max.apply(null, totals);
    var bottom = d.list.filter(function (r) { return r.total === minT; }), tops = d.list.filter(function (r) { return r.total === maxT; });

      '<div class="btn-row"><button type="button" class="btn sm" data-act="sum-go" data-wk="' + prevWeek(wk) + '"' + (wk <= first ? ' disabled' : '') + '>Earlier week</button>' +

        '<div class="stat">' + av(bottom[0].p.id) + '<div><div class="k">Bottom of the week</div><div class="v">' + esc(namesList(bottom.map(function (r) { return r.p; }))) + ', ' + plural(minT, 'point', 'points') + '</div></div></div></div>';

      return '<li>' + av(x.who, 'sm') + '<span><b>' + esc(x.z.name) + '</b> <span class="muted">' + esc(person(x.who).name) + '</span></span>' + st + more + '</li>';
    }).join('') + '</ul></section>';

    html += '<section class="sum-sec"><h3>Points this week</h3><table class="sum-table"><thead><tr><th scope="col">Who</th><th scope="col">Jobs</th>' +
      '<th scope="col">Points</th><th scope="col">Minus</th><th scope="col">Total</th></tr></thead><tbody>' + d.list.map(function (r) {

    html += '<section class="sum-sec"><h3>Who did what</h3><ul class="did">' + d.list.map(function (r) {

  function saveSettings(form) {
    var err = [], keep = [], leaving = {}, seen = {};
    [].forEach.call(form.querySelectorAll('.person-row'), function (r) {
      var id = r.getAttribute('data-person-row');
      if (r.classList.contains('leaving')) { leaving[id] = true; return; }
      keep.push({ id: id, name: r.querySelector('input').value.trim() });
    });
    Object.keys(backIn).forEach(function (id) { keep.push({ id: id, name: person(id).name }); });
    if (keep.some(function (k) { return !k.name; })) err.push('Every person needs a name.');
    if (keep.some(function (k) { var n = k.name.toLowerCase(); if (seen[n]) return true; seen[n] = true; return false; })) err.push('Two people have the same name.');
    if (keep.length < 2) err.push('Keep at least two people.');
    if (keep.length > MAX_PEOPLE) err.push(MAX_PEOPLE + ' people is the most.');
    var jobs = [].map.call(form.querySelectorAll('.job-row'), function (r) {
      return { id: r.getAttribute('data-job'), name: r.querySelector('.j-name').value.trim(), pts: +r.querySelector('.j-pts').value, lock: +r.querySelector('.j-lock').value };
    }).filter(function (j) { return j.name; });
    if (!jobs.length) err.push('Keep at least one job.');
    var zones = [].map.call(form.querySelectorAll('.zone-row'), function (r) {
      var id = r.getAttribute('data-zone'), old = zoneById(id), used = {};
      var items = r.querySelector('.z-items').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean).map(function (n) {
        // Keep a job's id when its name stays, so ticks already made this week still count.
        var match = old.items.filter(function (x) { return x.name.toLowerCase() === n.toLowerCase() && !used[x.id]; })[0];
        if (match) { used[match.id] = true; return { id: match.id, name: n }; }
        return { id: id + 't' + uid(), name: n };
      });
      return { id: id, name: r.querySelector('.z-name').value.trim(), items: items };
    });
    if (zones.some(function (z) { return !z.name; })) err.push('Every zone needs a name.');
    if (zones.some(function (z) { return !z.items.length; })) err.push('Every zone needs at least one job.');
    var assign = {}, used = {};
    [].forEach.call(form.querySelectorAll('.assign'), function (s) { assign[s.getAttribute('data-zone')] = s.value; used[s.value] = true; });
    var peopleChanged = Object.keys(leaving).length || Object.keys(backIn).length || keep.some(function (k) { return !findPerson(k.id); });
    if (!peopleChanged && Object.keys(used).length !== Math.min(activePeople().length, zones.length)) err.push('Each person needs a different zone this week.');
    if (err.length) { showErr('set-err', err.join(' ')); return; }

    Object.keys(leaving).forEach(function (id) { var p = findPerson(id); if (p) p.gone = true; });
    S.jobs = jobs;
    S.zones = zones;
    S.penalty = +form.querySelector('#pen').value;
    S.dishesPer = +form.querySelector('#dper').value;
    if (peopleChanged) {
      // This week stays as it is; the new line-up starts next Monday.
      reanchor(wk);
    } else {
      S.rot = { anchor: wk, zones: S.zones.map(function (z) { return assign[z.id]; }), captain: form.querySelector('#cap').value };
      S.weeks[wk] = computeWeek(wk);
    }
    S.keepAwake = form.querySelector('#awake').checked;
    save(); closeModal(); render(); applyWakeLock();
    toast(peopleChanged ? 'Saved. The new line-up starts next Monday.' : 'Saved.');
  }
  function doBackup() {
    S.lastBackup = new Date().toISOString();
    save();
    var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'house-jobs-backup-' + dayKey(new Date()) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.parentNode.removeChild(a); }, 1500);
    toast('Backup saved to Downloads.');
  }
  var pendingRestore = null;
  function readRestore(file) {
    var r = new FileReader();
    r.onload = function () {
      var s = null;
      try { s = JSON.parse(r.result); } catch (e) { s = null; }
      if (!valid(s)) { toast('That file is not a House Jobs backup.'); return; }
      pendingRestore = upgrade(s);
      openModal('<h2 id="m-title">Restore this backup?</h2><p class="lead">It replaces everything on this tablet with the backup' +
        (s.lastBackup ? ' from ' + esc(fmtShort.format(new Date(s.lastBackup))) : '') + '.</p>' +
        '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-act="restore-yes">Restore</button></div>');
    };
    r.readAsText(file);
  }

  /* ---------- keep the screen on ---------- */
  var wakeLock = null, wakePending = false;
  function applyWakeLock() {
    try {
      if (!('wakeLock' in navigator)) return;
      if (!S.keepAwake || document.visibilityState !== 'visible') {
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
        return;
      }
      if (wakeLock || wakePending) return;
      wakePending = true;
      navigator.wakeLock.request('screen').then(function (l) {
        wakePending = false; wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { wakePending = false; });
    } catch (e) { wakePending = false; }
  }

  /* ---------- taps ---------- */
  function takeBack(id) {
    S.entries = S.entries.filter(function (x) { return x.id !== id; }); save(); render(); toast('Taken back.');
  }
  var handlers = {
    job: function (el, id) {
      var j = jobById(id); if (!j) return;
      var now = new Date(), last = lastFor(j.id);
      if (last) {
        var at = new Date(last.at), until = new Date(at.getTime() + j.lock * 60000);
        if (now < until) { toast(person(last.who).name + ' did this at ' + hhmm(at) + '. It opens again at ' + hhmm(until) + '.'); return; }
      }
      openModal('<h2 id="m-title">Who did it?</h2><p class="lead">' + esc(j.name) + ', +' + plural(j.pts, 'point', 'points') + '</p><div class="pick-grid">' +
        activePeople().map(function (p) {
          return '<button type="button" class="pick" data-act="pick" data-id="' + p.id + '" data-job="' + esc(j.id) + '">' + av(p.id) + '<span>' + esc(p.name) + '</span></button>';
        }).join('') + '</div><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button></div>', activePeople().length > 4 ? 'wide' : '');
    },
    pick: function (el, pid) {
      var j = jobById(el.getAttribute('data-job'));
      if (!j) { closeModal(); return; }
      var now = new Date(), last = lastFor(j.id);
      if (last && now - new Date(last.at) < j.lock * 60000) { closeModal(); toast('Someone just logged that one.'); return; }
      var e = { id: uid(), kind: 'job', job: j.id, jobName: j.name, pts: j.pts, who: pid, at: now.toISOString() };
      S.entries.push(e); save(); closeModal(); render();
      toast('+' + j.pts + ' for ' + person(pid).name + ': ' + j.name, { label: 'Undo', fn: function () { takeBack(e.id); } });
    },
    dishes: function () { openDishes(); },
    'dd-step': function (el, step) {
      dd.n = Math.max(1, Math.min(40, dd.n + (+step)));
      document.getElementById('dd-n').textContent = dd.n;
      document.getElementById('dd-pts').textContent = '= ' + plural(dishPoints(dd.n), 'point', 'points');
    },
    'dd-owner': function (el, id) { dd.owner = dd.owner === id ? null : id; setPressed('owner', dd.owner); showErr('dd-err', ''); },
    'dd-pick': function (el, pid) {
      if (dd.owner === pid) { showErr('dd-err', 'Your own dishes don’t count. Pick who washed them, or change whose they were.'); return; }
      var now = new Date(), pts = dishPoints(dd.n);
      var e = { id: uid(), kind: 'job', job: DISH, jobName: DISH_NAME, pts: pts, count: dd.n, owner: dd.owner, who: pid, at: now.toISOString() };
      S.entries.push(e); save(); closeModal(); render();
      toast('+' + pts + ' for ' + person(pid).name + ': ' + (e.owner ? e.count + ' of ' + possessive(person(e.owner).name) + ' dishes' : plural(e.count, 'dish', 'dishes')),
        { label: 'Undo', fn: function () { takeBack(e.id); } });
    },
    minus: function () { openMinus(); },
    md: function (el, id) {
      var grp = el.getAttribute('data-grp');
      md[grp] = md[grp] === id ? null : id;   // tap again to clear
      setPressed(grp, md[grp]);
      // Nobody can give themselves a minus.
      if (md.to && md.to === md.from) { md.to = null; setPressed('to', null); }
      [].forEach.call(modalRoot.querySelectorAll('.pill[data-grp="to"]'), function (b) { b.disabled = b.getAttribute('data-id') === md.from; });
      showErr('md-err', '');
    },
    'md-give': function () {
      var text = ((document.getElementById('md-text') || {}).value || '').trim();
      var other = md.why != null && +md.why === OTHER;
      var chip = md.why != null && !other ? REASONS[+md.why] : '';
      var reason = chip && text ? chip + ': ' + text : (text || chip);
      if (!md.from) { showErr('md-err', 'Pick who is giving it.'); return; }
      if (!md.to) { showErr('md-err', 'Pick who gets it.'); return; }
      if (other && !text) { showErr('md-err', 'You picked Other, so say what happened.'); return; }
      if (!reason) { showErr('md-err', 'Say why, so everyone knows what it was for.'); return; }
      var now = new Date(), today = dayKey(now);
      var twice = S.entries.some(function (e) { return e.kind === 'minus' && e.from === md.from && e.who === md.to && dayKey(new Date(e.at)) === today; });
      if (twice) { showErr('md-err', person(md.from).name + ' already gave ' + person(md.to).name + ' a minus today. One a day each.'); return; }
      var e = { id: uid(), kind: 'minus', who: md.to, from: md.from, pts: -1, reason: reason, at: now.toISOString() };
      S.entries.push(e); save(); closeModal(); render();
      toast('Minus 1 for ' + person(e.who).name + ', from ' + person(e.from).name + '.', { label: 'Undo', fn: function () { takeBack(e.id); } });
    },
    undo: function (el, id) {
      var e = entryById(id); if (!e) return;
      if (new Date() - new Date(e.at) > UNDO_MS) { render(); toast('Too late to undo here. Use See everything.'); return; }
      takeBack(id);
    },
    zone: function (el, zid) { openZone(el.getAttribute('data-wk'), zid); },
    item: function (el, itemId) {
      var wk = el.getAttribute('data-wk'), zid = el.getAttribute('data-zone');
      if (!canTick(wk, new Date())) { openZone(wk, zid); return; }
      var finished = toggleItem(wk, zid, itemId);
      render(); openZone(wk, zid);
      if (finished) toast(zoneById(zid).name + ' is done. Nice one, ' + person(week(wk).zones[zid]).name + '.');
    },
    sumup: function () { openSumup(defaultSumWeek(new Date())); },
    'sum-go': function (el) { openSumup(el.getAttribute('data-wk')); },
    'copy-sum': function () {
      var wk = sumWeek || weekKey(new Date()), now = new Date(), link = waLinkFor(wk, now);
      copyText(decodeURIComponent(link.split('text=')[1]));
    },
    log: function () { openLog(); },
    remove: function (el, key) {
      requirePin(function () { removeItem(key); openLog(); toast('Removed.'); });
    },
    settings: function () { requirePin(openSettings); },
    close: function () { closeModal(); },
    'job-add': function () {
      var box = document.getElementById('job-rows');
      if (!box) return;
      if (box.querySelectorAll('.job-row').length >= 12) { toast('Twelve jobs is the most.'); return; }
      box.insertAdjacentHTML('beforeend', jobRowHtml({ id: 'j' + uid(), name: '', pts: 1, lock: 60 }));
      var inputs = box.querySelectorAll('.j-name');
      inputs[inputs.length - 1].focus();
    },
    'job-del': function (el) { var row = el.closest('.job-row'); if (row) row.parentNode.removeChild(row); },
    'person-add': function () {
      var box = document.getElementById('people-rows');
      if (!box) return;
      var here = box.querySelectorAll('.person-row:not(.leaving)').length + Object.keys(backIn).length;
      if (here >= MAX_PEOPLE) { toast(MAX_PEOPLE + ' people is the most.'); return; }
      var used = [].map.call(box.querySelectorAll('.person-row'), function (r) { return r.getAttribute('data-person-row'); });
      var id = nextPersonId();
      while (used.indexOf(id) >= 0) id = 'p' + (+id.slice(1) + 1);
      box.insertAdjacentHTML('beforeend', personRowHtml({ id: id, name: '' }));
      var inputs = box.querySelectorAll('.person-row input');
      inputs[inputs.length - 1].focus();
    },
    'person-out': function (el) {
      var row = el.closest('.person-row');
      if (!row) return;
      if (!findPerson(row.getAttribute('data-person-row'))) { row.parentNode.removeChild(row); return; }   // added by mistake
      var out = row.classList.toggle('leaving');
      el.textContent = out ? 'Undo' : 'Moved out';
    },
    'person-back': function (el, id) {
      if (backIn[id]) { delete backIn[id]; el.textContent = 'Moved back in'; }
      else { backIn[id] = true; el.textContent = 'Moving back in (undo)'; }
    },
    fullscreen: function () {
      var d = document.documentElement, fn = d.requestFullscreen || d.webkitRequestFullscreen;
      var nope = function () { toast('This browser will not go full screen. Use Add to Home Screen instead.'); };
      if (!fn) { nope(); return; }
      try { var p = fn.call(d); if (p && p.catch) p.catch(nope); } catch (e) { nope(); }
    },
    backup: function () { doBackup(); },
    'restore-yes': function () {
      if (!pendingRestore) return;
      S = pendingRestore; pendingRestore = null; migrateLayout(new Date()); save(); closeModal(); render(); toast('Backup restored.');
    },
    'pin-save': function () {
      var a = (document.getElementById('cp1') || {}).value || '', b = (document.getElementById('cp2') || {}).value || '';
      var msg = checkNewPin(a, b);
      showErr('cp-err', msg);
      if (msg) return;
      S.pin = hashPin(a); save();
      document.getElementById('cp1').value = ''; document.getElementById('cp2').value = '';
      toast('PIN changed.');
    },
    reset: function () {
      openModal('<h2 id="m-title">Start again?</h2><p class="lead">This wipes every point, tick and minus for everyone. People, jobs, zones and the PIN stay. Save a backup first if you might want them back.</p>' +
        '<div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn danger" data-act="reset-yes">Wipe and start again</button></div>');
    },
    'reset-yes': function () {
      var now = new Date();
      S.entries = []; S.ticks = {}; S.itemTicks = {}; S.excused = {}; S.weeks = {}; S.start = dayKey(now);
      ensureWeeks(now); save(); closeModal(); render(); toast('Fresh start. Everyone is on zero.');
    }
  };

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t && t.hasAttribute && t.hasAttribute('data-scrim')) { closeModal(); return; }
    var el = t && t.closest ? t.closest('[data-act]') : null;
    if (el && !el.disabled && handlers[el.getAttribute('data-act')]) {
      ev.preventDefault();
      handlers[el.getAttribute('data-act')](el, el.getAttribute('data-id'));
    }
    applyWakeLock();
  });
  document.addEventListener('submit', function (ev) {
    var form = ev.target, kind = form.getAttribute('data-form');
    if (!kind) return;
    ev.preventDefault();
    if (kind === 'pin') {
      var v = document.getElementById('pin-in').value;
      if (hashPin(v) !== S.pin) { showErr('pin-err', 'That is not the PIN.'); document.getElementById('pin-in').select(); return; }
      pinOpenUntil = Date.now() + PIN_OPEN_MS;
      var fn = pendingPin; closeModal(); if (fn) fn();
    } else if (kind === 'newpin') {
      var a = document.getElementById('np1').value, b = document.getElementById('np2').value, msg = checkNewPin(a, b);
      showErr('pin-err', msg);
      if (msg) return;
      S.pin = hashPin(a); save(); pinOpenUntil = Date.now() + PIN_OPEN_MS;
      var fn2 = pendingPin; closeModal(); toast('PIN saved.'); if (fn2) fn2();
    } else if (kind === 'settings') {
      saveSettings(form);
    }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'restore-file' && ev.target.files && ev.target.files[0]) readRestore(ev.target.files[0]);
  });
  document.addEventListener('keydown', function (ev) {
    if (!modalRoot.innerHTML) return;
    if (ev.key === 'Escape') { closeModal(); return; }
    if (ev.key !== 'Tab') return;
    var f = [].filter.call(modalRoot.querySelectorAll('button, a[href], input, select, textarea, label[for]'), function (x) { return !x.disabled && x.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });
  document.addEventListener('visibilitychange', function () {
    // Re-read from storage only when storage works, or a tablet with blocked storage would lose its points.
    if (document.visibilityState === 'visible') { if (storageOK) { S = load(new Date()); migrateLayout(new Date()); } render(); }
    applyWakeLock();
  });
  window.addEventListener('storage', function (e) { if (e.key === KEY && storageOK) { S = load(new Date()); migrateLayout(new Date()); render(); } });
  // Redraw every minute, so a locked job opens again on its own and the clock stays right.
  setInterval(function () { var n = new Date(); if (dayKey(n) + ' ' + hhmm(n) !== lastMinute) render(); }, 5000);

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  migrateLayout(new Date());
  save();
  render();
  applyWakeLock();
})();
</script>
</body>
</html>
